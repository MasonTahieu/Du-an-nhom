[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-equity-research"
version = "0.1.0"
description = "Vietnam equity research with reproducible local datasets and PDF reports"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "pandas==2.3.3", "pyarrow==25.0.1", "matplotlib==3.11.2", "reportlab==4.5.1"]

[project.scripts]
vnresearch = "vnresearch.cli:main"

[tool.setuptools]
packages = ["vnresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
